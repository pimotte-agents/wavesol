# wavesol's documentation is itself a wavesol talk. Present it with: npx wavesol dev docs
$schema: ../schema/talk.schema.json
title: wavesol
subtitle: Presentations woven as a fabric
authors: [The wavesol authors]

theme:
  base: academic-light

transitions:
  default: fly

layout:
  direction: right
  algorithm: force

nodes:
  welcome: {}
  idea: {}
  map: {}                          # the hub: one edge per topic

  navigating:
    type: frame
    title: Navigating
    children: [nav-steps, nav-edges, nav-back, nav-overview]
  nav-steps: {}
  nav-edges: {}
  nav-back: {}
  nav-overview: {}

  presenting:
    type: frame
    title: Presenting
    children: [nav-presenter, nav-phone, poll, transitions]
  nav-presenter: {}
  nav-phone: {}
  poll: {}
  transitions: {}

  writing:
    type: frame
    title: Writing a talk
    children: [format-dir, format-talk, format-edges, format-nodes]
  format-dir: {}
  format-talk: {}
  format-edges: {}
  format-nodes: {}

  content:
    type: frame
    title: Content
    children: [slides, fragments, math-code, figure, tikz, tikz-figure, citations]
  slides: {}
  fragments: {}
  math-code: {}
  figure: {}
  tikz: {}
  tikz-figure: {}
  citations: {}

  structure:
    type: frame
    title: Structure and look
    children: [frames, layout, theming]
  frames: {}
  layout: {}
  theming: {}

  tools:
    type: frame
    title: Tools
    children: [cli, check, ai]
  cli: {}
  check: {}
  ai: {}

  lean:
    type: frame
    title: Lean proofs
    children: [lean-intro, lean-rev, lean-pal]
  lean-intro: {}
  lean-rev: {}
  lean-pal: {}

  roadmap: {}
  refs: { type: references, title: References }

edges:
  - welcome -> idea: { default: true }
  - welcome -> map: { label: "Skip to the topics" }
  - idea -> map: { default: true }

  # the hub: buttons 1–7, Space starts with the first topic
  - map -> navigating: { default: true }
  - map -> presenting
  - map -> writing
  - map -> content
  - map -> structure
  - map -> tools
  - map -> lean
  - map -> roadmap

  # into each topic
  - navigating -> nav-steps: { default: true, transition: zoom-through }
  - presenting -> nav-presenter: { default: true, transition: zoom-through }
  - writing -> format-dir: { default: true, transition: zoom-through }
  - content -> slides: { default: true, transition: zoom-through }
  - structure -> frames: { default: true, transition: zoom-through }
  - tools -> cli: { default: true, transition: zoom-through }
  - lean -> lean-intro: { default: true, transition: zoom-through }

  # through each topic
  - nav-steps -> nav-edges -> nav-back -> nav-overview: { default: true }
  - nav-presenter -> nav-phone -> poll -> transitions: { default: true }
  - format-dir -> format-talk -> format-edges -> format-nodes: { default: true }
  - slides -> fragments -> math-code -> figure -> tikz -> tikz-figure -> citations: { default: true }
  - frames -> layout -> theming: { default: true }
  - cli -> check -> ai: { default: true }
  - lean-intro -> lean-rev -> lean-pal: { default: true }

  # Space at the end of a topic goes on to the next one; or back to the hub
  - nav-overview -> presenting: { default: true }
  - transitions -> writing: { default: true }
  - format-nodes -> content: { default: true }
  - citations -> structure: { default: true }
  - theming -> tools: { default: true }
  - ai -> lean: { default: true }
  - lean-pal -> roadmap: { default: true }
  - nav-overview -> map: { label: "Back to the topics" }
  - transitions -> map: { label: "Back to the topics" }
  - format-nodes -> map: { label: "Back to the topics" }
  - citations -> map: { label: "Back to the topics" }
  - citations -> refs: { label: "References" }
  - roadmap -> refs: { label: "References" }
  - refs -> map: { label: "Back to the topics" }
  - theming -> map: { label: "Back to the topics" }
  - ai -> map: { label: "Back to the topics" }
  - lean-pal -> map: { label: "Back to the topics" }
  - roadmap -> map: { label: "Back to the topics" }
  - roadmap -> welcome: { label: "Back to the start", transition: fade }

  # cross-links between related slides in different topics
  - nav-edges -> roadmap: { label: "Detour: what's next?" }
  - nav-steps -> fragments: { label: "How steps are written (fragments)" }
  - format-edges -> nav-edges: { label: "Taking edges while presenting" }
  - math-code -> theming: { label: "How does it look? (theming)" }
  - nav-overview -> layout: { label: "How the canvas is laid out" }
  - nav-phone -> cli: { label: "wavesol serve --host" }
  - check -> format-talk: { label: "What check reads: talk.yaml" }
  - frames -> transitions: { label: "Transitions into frames" }
  - math-code -> lean-intro: { label: "Proofs in Lean" }
