# Builds the talk and publishes it to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Lean nodes: only when the talk has a lean/ project. The toolchain and the project's build
      # (SubVerso, Mathlib if you use it) are cached between runs.
      - if: hashFiles('lean/lean-toolchain') != ''
        run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none && echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - if: hashFiles('lean/lean-toolchain') != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            lean/.lake
          key: lean-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}
      # with Mathlib, fetch its prebuilt files instead of compiling it
      - if: hashFiles('lean/lake-manifest.json') != ''
        working-directory: lean
        run: |
          if grep -q '"name": "mathlib"' lake-manifest.json; then lake exe cache get; fi
      # TikZ figures: TeX and poppler, only when the talk has any
      - name: Install TeX (if the talk uses TikZ)
        run: |
          if grep -rqE '^(```|~~~) *tikz(cd)?\b|^type: *tikz\b' nodes; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures poppler-utils
          fi
      # pdf: in talk.yaml: the PDF is printed by Chromium (Playwright)
      - name: Install Chromium (if the talk has a PDF)
        run: |
          if grep -qE '^pdf:' talk.yaml; then npm install --no-save playwright && npx playwright install --with-deps chromium; fi
      - run: npx wavesol build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
